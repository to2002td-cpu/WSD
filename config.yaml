# Base config (EleutherAI/pythia-6.9b). Per-model configs in configs/ inherit
# this via `base:` and override only extract.model / extract.layers / revisions.
storage_root: /home/tderrien/WSD/data

lemmas_file: lemmas/nouns_top50.txt   # top-50 nouns by frequency (the study set)
synsets_cache: synsets.json
synsets_pos: [n]                # restrict studied senses to nouns (null = all content POS)

generate:
  api_url: https://ragarenn.eskemm-numerique.fr/sso/ch@t/api/chat/completions
  api_key_file: data/api.txt
  styles_file: prompts/styles.json
  prompt_file: prompts/generate.txt
  model: gemma-4-31b
  max_tokens: 2048
  per_synset: 1000               # sentences per sense = per_synset (balanced: 1000 / 20 styles = 50 each)
  max_attempts: 200              # per (sense, style) request cap before giving up
  workers: 16
  out_dir: generated
  seed: 0                        # deterministic style/seed assignment

dataset:
  path: dataset.jsonl
  require_valid: true
  min_examples_per_sense: 1
  max_examples_per_sense: 9999
  seed: 42

extract:
  model: EleutherAI/pythia-6.9b
  # Pythia revisions are step{N}; step0, powers of two to 512, then every 1000.
  steps: [0, 512, 1000, 5000, 20000, 50000, 100000, 143000]
  layers: [1, 8, 16, 24, 32]     # 1-indexed hidden layers (pythia-6.9b has 32)
  revision_format: "step{step}"  # models with token-tagged branches list them in `revisions`
  batch_size: 128
  max_length: 512
  device: null                   # cuda | mps | cpu (null = auto)
  emb_dir: embeddings
  cache_dir: /home/tderrien/storage/cache/huggingface/hub   # HF hub cache (reused, not downloaded)
  purge_cache: true              # drop each checkpoint's weights after use (bounds disk to 1 ckpt)

plot:
  fig_dir: figures
  min_per_sense: 6
  npy_cache: false               # read straight from the .npz (no unzipped .npy twins)

similarity:                      # sense-cluster purity (k-NN neighbourhood purity)
  out_dir: similarity
  max_per_sense: 1000            # balanced cap per sense (kNN is O(n^2))
  max_senses: 12                 # cap senses per word
  knn_ks: [5, 10, 20, 50, 100, 200, 500, 1000, 2000]   # neighbour counts for the purity surface
  seed: 0
