storage_root: /home/tderrien/WSD/data

lemmas_file: lemmas.txt
synsets_cache: synsets.json     

generate:
  api_url: https://ragarenn.eskemm-numerique.fr/sso/ch@t/api/chat/completions
  api_key_file: data/api.txt
  styles_file: data/styles.json
  prompt_file: prompts/generate.txt
  model: gemma-4-31b
  max_tokens: 2048
  per_synset: 1000
  max_attempts: 2000
  workers: 16
  out_dir: generated            

dataset:
  path: dataset.jsonl
  require_valid: true
  min_examples_per_sense: 1
  max_examples_per_sense: 9999
  seed: 42

extract:
  model: EleutherAI/pythia-6.9b
  steps: [0, 64, 128, 256, 512, 1000, 8000, 16000, 32000, 64000, 128000, 143000]
  layers: [1, 8, 16, 24, 32]
  batch_size: 128
  max_length: 512
  device: null                   # cuda | mps | cpu (null = auto)
  emb_dir: embeddings
  cache_dir: /home/tderrien/storage/cache/huggingface/hub   # HF hub cache (reused, not downloaded)
  purge_cache: false             # true only bounds disk to 1 ckpt; deletes the cache above

plot:
  fig_dir: figures
  min_per_sense: 6
  npy_cache: true
