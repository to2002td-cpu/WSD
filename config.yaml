storage_root: /home/tderrien/WSD/data

lemmas_file: nouns_top50.txt    # top-50 nouns by frequency (limited run for now)
synsets_cache: synsets.json
synsets_pos: [n]                # restrict studied senses to nouns (null = all content POS)

generate:
  api_url: https://ragarenn.eskemm-numerique.fr/sso/ch@t/api/chat/completions
  api_key_file: data/api.txt
  styles_file: data/styles.json
  prompt_file: prompts/generate.txt
  model: gemma-4-31b
  max_tokens: 2048
  per_synset: 1000
  max_attempts: 2000
  workers: 16
  out_dir: generated            

dataset:
  path: dataset.jsonl
  require_valid: true
  min_examples_per_sense: 1
  max_examples_per_sense: 9999
  seed: 42

extract:
  model: EleutherAI/pythia-6.9b
  # Pythia checkpoints are log-spaced early (powers of two: ...128, 256, 512),
  # then every 1000. There is no step250/step500 revision -> 256/512 are the
  # nearest real checkpoints to the requested 250/500.
  steps: [0, 256, 512, 1000, 8000, 16000, 32000, 64000, 128000, 143000]
  layers: [1, 8, 16, 24, 32]
  batch_size: 128
  max_length: 512
  device: null                   # cuda | mps | cpu (null = auto)
  emb_dir: embeddings
  cache_dir: /home/tderrien/storage/cache/huggingface/hub   # HF hub cache (reused, not downloaded)
  purge_cache: true              # drop each checkpoint's ~14 GB weights after use (bounds disk to 1 ckpt)

plot:
  fig_dir: figures
  min_per_sense: 6
  npy_cache: false               # no unzipped .npy twins on disk; read straight from the .npz

similarity:                        # sense-cluster purity (k-NN neighbourhood purity)
  out_dir: similarity
  max_per_sense: 1000              # balanced cap per sense (uses all ~1000/sense; kNN is O(n^2))
  max_senses: 12                   # cap senses per word (bounds the membership matrix)
  knn_k: 10                        # reference neighbour count (heatmaps + membership matrix)
  knn_ks: [5, 10, 20, 50, 100, 200, 500, 1000, 2000]   # neighbour counts swept for the purity surface
  seed: 0
