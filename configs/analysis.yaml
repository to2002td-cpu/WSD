dataset:
  path: dataset.jsonl
  require_valid: true

plot:
  fig_dir: pca                     # per-condition PCA scatter grids -> pca/{word}_pca.{pdf,png}
  min_per_sense: 6
  npy_cache: false                 # read straight from the .npz (no unzipped .npy twins)

purity:                            # sense-cluster purity + margin (k-NN neighbourhood metrics)
  out_dir: purity                  # -> purity/{data,heatmap,auc,pk,margin}/
  knn_ks: [5, 10, 20, 50, 100, 200, 500, 1000, 2000]   # neighbour counts for the k sweep
  seed: 0
