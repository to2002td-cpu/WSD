[project]
name = "wsd-probe"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.26",
    "nltk>=3.9.4",
    "numpy>=2.4.6",
    "pyyaml>=6.0",
    "requests>=2.32.0",
    "torch>=2.12.1",
    "tqdm>=4.68.4",
    "transformers>=5.13.0",
]

# `plot` only, so generate/extract jobs skip the UMAP stack:  uv sync --extra plot
[project.optional-dependencies]
plot = [
    "matplotlib>=3.11.0",
    "pandas>=3.0.3",
    "umap-learn>=0.5.7",
    "numba>=0.60",
    "scipy>=1.11",
]
